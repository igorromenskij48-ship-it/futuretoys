<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FutureToys | Кибер-Магазин</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #05050a; color: #fff; overflow-x: hidden; position: relative; }
    
    .bg-anim { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; pointer-events: none; }
    .bg-anim div { position: absolute; width: 2px; height: 100px; background: linear-gradient(to bottom, transparent, #00f3ff); animation: fall linear infinite; }
    @keyframes fall { to { transform: translateY(100vh); } }

    /* Шапка */
    header { padding: 15px 5%; background: rgba(10, 10, 20, 0.9); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #00f3ff; position: fixed; top: 0; left: 0; width: 100%; z-index: 100; backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); }
    .logo { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; color: #00f3ff; text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff; cursor: pointer; letter-spacing: 2px; animation: flicker 3s infinite alternate; }
    @keyframes flicker { 0% { opacity: 1; } 90% { opacity: 1; } 95% { opacity: 0.6; } 100% { opacity: 1; } }
    
    nav { display: flex; gap: 25px; }
    nav a { color: #a0a0b0; text-decoration: none; font-weight: 600; transition: 0.3s; }
    nav a:hover { color: #00f3ff; text-shadow: 0 0 10px #00f3ff; }
    
    .auth-buttons { display: flex; gap: 10px; align-items: center; }
    .btn { padding: 10px 22px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; border: none; font-size: 14px; }
    .btn-login { background: transparent; color: #fff; border: 1px solid #a0a0b0; }
    .btn-login:hover { border-color: #00f3ff; color: #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.5); }
    .btn-register { background: linear-gradient(45deg, #bc13fe, #7a00ff); color: #fff; box-shadow: 0 0 15px rgba(188,19,254,0.5); }
    .btn-register:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(188,19,254,0.8); }
    .btn-cart { background: linear-gradient(45deg, #00f3ff, #0088ff); color: #0a0a12; position: relative; }
    .btn-cart:hover { box-shadow: 0 0 25px rgba(0,243,255,0.8); }
    
    /* Кнопка Доната */
    .btn-donate { background: linear-gradient(45deg, #ff4d4d, #ff8c00); color: #fff; box-shadow: 0 0 15px rgba(255,77,77,0.4); }
    .btn-donate:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(255,77,77,0.8); }

    .btn-admin { background: transparent; color: #888; border: 1px solid #444; padding: 8px 15px; font-size: 12px; border-radius: 5px; margin-right: 5px; transition: 0.3s; }
    .btn-admin:hover { color: #00f3ff; border-color: #00f3ff; box-shadow: 0 0 10px rgba(0,243,255,0.3); }

    .user-greeting { color: #00f3ff; font-weight: bold; margin-right: 10px; text-shadow: 0 0 10px #00f3ff; }

    /* Главный экран */
    .hero { text-align: center; padding: 160px 20px 100px; }
    .hero h1 { font-family: 'Orbitron', sans-serif; font-size: 52px; color: #00f3ff; margin-bottom: 20px; text-shadow: 0 0 20px #00f3ff, 0 0 40px #bc13fe; }
    .hero p { color: #a0a0b0; font-size: 18px; margin-bottom: 30px; }

    /* Счетчики и т.д. (как было) */
    .counters { display: flex; justify-content: space-around; padding: 40px 5%; background: #080810; border-top: 1px solid #1a1a2e; border-bottom: 1px solid #1a1a2e; flex-wrap: wrap; gap: 20px; }
    .counter-box { text-align: center; }
    .counter-num { font-size: 36px; font-weight: bold; color: #00f3ff; font-family: 'Orbitron', sans-serif; }
    .counter-label { color: #a0a0b0; font-size: 14px; text-transform: uppercase; margin-top: 5px; }

    .features { display: flex; justify-content: space-around; padding: 50px 5%; flex-wrap: wrap; gap: 20px; background: #0a0a14; }
    .feature { text-align: center; max-width: 200px; background: #0f0f1a; padding: 20px; border-radius: 15px; border: 1px solid #333; transition: 0.3s; }
    .feature:hover { border-color: #bc13fe; transform: translateY(-5px); }
    .feature-icon { font-size: 36px; margin-bottom: 10px; }
    .feature h4 { color: #00f3ff; margin-bottom: 5px; }
    .feature p { color: #a0a0b0; font-size: 14px; }
    
    .catalog { padding: 40px 5%; }
    .section-title { text-align: center; font-size: 36px; margin-bottom: 50px; font-family: 'Orbitron', sans-serif; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; }
    
    .card { background: #0f0f1a; border-radius: 15px; padding: 20px; border: 1px solid #333; text-align: center; transition: 0.4s; position: relative; }
    .card:hover { border-color: #00f3ff; transform: translateY(-10px) scale(1.02); box-shadow: 0 15px 30px rgba(0,243,255,0.2); }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; border-bottom: 2px solid #333; }
    .card h3 { margin: 15px 0 5px; font-size: 18px; }
    .price { color: #bc13fe; font-size: 22px; font-weight: bold; margin: 10px 0; }
    .add-btn { background: transparent; color: #00f3ff; border: 1px solid #00f3ff; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .add-btn:hover { background: rgba(0,243,255,0.1); box-shadow: 0 0 20px rgba(0,243,255,0.4); }

    footer { text-align: center; padding: 40px; color: #555; border-top: 1px solid #1a1a2e; margin-top: 50px; }
</style>
</head>
<body>

<header>
    <div class="logo" onclick="window.scrollTo(0,0)">FutureToys</div>
    <nav>
        <a href="#about">О нас</a>
        <a href="#catalog">Игрушки</a>
        <a href="#contacts">Контакты</a>
    </nav>
    <div class="auth-buttons">
        <!-- КНОПКА ПОЖЕРТВОВАНИЯ -->
        <a href="https://pay.cloudtips.ru/p/f54b9c04" target="_blank" class="btn btn-donate">❤️ Поддержать</a>
        
        <button class="btn btn-admin" onclick="alert('Вход в админку (пароль admin926)')">⚙️ Админ</button>
        <button class="btn btn-login" onclick="alert('Вход в разработке')">Вход</button>
        <button class="btn btn-register" onclick="alert('Регистрация в разработке')">Регистрация</button>
        <button class="btn btn-cart" onclick="alert('Корзина в разработке')">Корзина (0)</button>
    </div>
</header>

<div class="hero">
    <h1>ИГРУШКИ ИЗ БУДУЩЕГО</h1>
    <p>Уникальные 3D-модели, напечатанные на 3D-принтере.</p>
</div>

<div class="catalog" id="catalog">
    <h2 class="section-title">Наш Каталог</h2>
    <div class="grid" id="productGrid"></div>
</div>

<footer id="contacts">
    &copy; 2024 Игрушки из Будущего.<br>
    📧 <a href="mailto:igorromenskij48@gmail.com" style="color: #00f3ff;">igorromenskij48@gmail.com</a> | 
    📱 <span style="color: #00f3ff;">+7 (926) 297-81-24</span>
</footer>

<script>
    // Список товаров (как на вашем скрине)
    const products = [
        { name: 'Однокликерный фиджет', price: 120, img: 'https://i.ibb.co/b53fZnCw/36f67016-04ce-4730-8e6e-fbeb761f0c0b.jpg' },
        { name: 'Скребок', price: 50, img: 'https://i.ibb.co/mrtNRFWT/36f67016-04ce-4730-8e6e-fbeb761f0c0b-1.jpg' },
        { name: 'Сюрикен', price: 70, img: 'https://i.ibb.co/4LyttDw/36f67016-04ce-4730-8e6e-fbeb761f0c0b-2.jpg' },
        { name: 'Кастет', price: 510, img: 'https://i.ibb.co/fdStnhCJ/36f67016-04ce-4730-8e6e-fbeb761f0c0b-3.jpg' },
        { name: 'Кубик антистресс', price: 290, img: 'https://i.ibb.co/xSnwfMQX/36f67016-04ce-4730-8e6e-fbeb761f0c0b-6.jpg' },
        { name: 'Брелок Мишка', price: 290, img: 'https://i.ibb.co/rGN3KPc3/36f67016-04ce-4730-8e6e-fbeb761f0c0b-5.jpg' },
        { name: 'Спиральный конус', price: 510, img: 'https://i.ibb.co/6JVbMc2s/36f67016-04ce-4730-8e6e-fbeb761f0c0b-4.jpg' },
        { name: 'Трехкликерный фиджет', price: 190, img: 'https://i.ibb.co/Rkm6rFLL/36f67016-04ce-4730-8e6e-fbeb761f0c0b-7.jpg' }
    ];

    const grid = document.getElementById('productGrid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="card">
                <img src="${p.img}" alt="${p.name}">
                <h3>${p.name}</h3>
                <div class="price">${p.price} ₽</div>
                <button class="add-btn" onclick="alert('Добавлено в корзину!')">Добавить</button>
            </div>
        `;
    });
</script>

</body>
</html>
