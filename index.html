<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FutureToys | Кибер-Магазин</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #05050a; color: #fff; overflow-x: hidden; }
    
    header { padding: 15px 5%; background: rgba(10, 10, 20, 0.9); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #00f3ff; position: fixed; top: 0; left: 0; width: 100%; z-index: 100; backdrop-filter: blur(10px); }
    .logo { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; color: #00f3ff; text-shadow: 0 0 10px #00f3ff; cursor: pointer; }
    nav { display: flex; gap: 25px; }
    nav a { color: #a0a0b0; text-decoration: none; font-weight: 600; transition: 0.3s; }
    nav a:hover { color: #00f3ff; }
    .auth-buttons { display: flex; gap: 10px; align-items: center; }
    .btn { padding: 10px 22px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; border: none; font-size: 14px; text-decoration: none; }
    .btn-login { background: transparent; color: #fff; border: 1px solid #a0a0b0; }
    .btn-register { background: linear-gradient(45deg, #bc13fe, #7a00ff); color: #fff; }
    .btn-cart { background: linear-gradient(45deg, #00f3ff, #0088ff); color: #0a0a12; }
    .btn-donate { background: linear-gradient(45deg, #ff4d4d, #ff8c00); color: #fff; }
    .btn-admin { background: transparent; color: #888; border: 1px solid #444; padding: 8px 15px; font-size: 12px; border-radius: 5px; }

    .hero { text-align: center; padding: 160px 20px 100px; }
    .hero h1 { font-family: 'Orbitron', sans-serif; font-size: 52px; color: #00f3ff; margin-bottom: 20px; text-shadow: 0 0 20px #00f3ff, 0 0 40px #bc13fe; }
    .hero p { color: #a0a0b0; font-size: 18px; margin-bottom: 30px; }

    .catalog { padding: 40px 5%; }
    .section-title { text-align: center; font-size: 36px; margin-bottom: 50px; font-family: 'Orbitron', sans-serif; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; }
    
    .card { background: #0f0f1a; border-radius: 15px; padding: 20px; border: 1px solid #333; text-align: center; transition: 0.3s; display: flex; flex-direction: column; }
    .card:hover { border-color: #00f3ff; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,243,255,0.2); }
    
    .card img { 
        width: 100%; 
        height: 200px; 
        object-fit: cover; 
        border-radius: 10px; 
        border-bottom: 2px solid #333; 
        margin-bottom: 15px;
        background-color: #222;
    }
    
    .card h3 { font-size: 18px; margin-bottom: 10px; min-height: 44px; }
    .price { color: #bc13fe; font-size: 22px; font-weight: bold; margin-bottom: 15px; }
    .add-btn { background: transparent; color: #00f3ff; border: 1px solid #00f3ff; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-top: auto; }
    .add-btn:hover { background: rgba(0,243,255,0.1); }

    footer { text-align: center; padding: 40px; color: #555; border-top: 1px solid #1a1a2e; margin-top: 50px; }
</style>
</head>
<body>

<header>
    <div class="logo" onclick="window.scrollTo(0,0)">FutureToys</div>
    <nav>
        <a href="#about">О нас</a>
        <a href="#catalog">Игрушки</a>
        <a href="#contacts">Контакты</a>
    </nav>
    <div class="auth-buttons">
        <a href="https://pay.cloudtips.ru/p/f54b9c04" target="_blank" class="btn btn-donate">❤️ Поддержать</a>
        <button class="btn btn-admin" onclick="alert('Пароль admin926')">⚙️ Админ</button>
        <button class="btn btn-login" onclick="alert('Вход в разработке')">Вход</button>
        <button class="btn btn-register" onclick="alert('Регистрация в разработке')">Регистрация</button>
        <button class="btn btn-cart" onclick="alert('Корзина в разработке')">Корзина (0)</button>
    </div>
</header>

<div class="hero">
    <h1>ИГРУШКИ ИЗ БУДУЩЕГО</h1>
    <p>Уникальные 3D-модели, напечатанные на 3D-принтере.</p>
</div>

<div class="catalog" id="catalog">
    <h2 class="section-title">Наш Каталог</h2>
    <div class="grid" id="productGrid"></div>
</div>

<footer id="contacts">
    &copy; 2024 Игрушки из Будущего.<br>
    📧 <a href="mailto:igorromenskij48@gmail.com" style="color: #00f3ff;">igorromenskij48@gmail.com</a> | 
    📱 <span style="color: #00f3ff;">+7 (926) 297-81-24</span>
</footer>

<script>
    // ВСТАВЛЯЕМ ВАШИ ФОТО КАК КОД
    const products = [
        { name: 'Однокликерный фиджет', price: 120, img: 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=' },
        { name: 'Скребок', price: 50, img: 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=' },
        { name: 'Сюрикен', price: 70, img: 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=' },
        { name: 'Кастет', price: 510, img: 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=' },
        { name: 'Кубик антистресс', price: 290, img: 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=' },
        { name: 'Брелок Мишка', price: 290, img: 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=' },
        { name: 'Спиральный конус', price: 510, img: 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=' },
        { name: 'Трехкликерный фиджет', price: 190, img: 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=' }
    ];

    const grid = document.getElementById('productGrid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="card">
                <img src="${p.img}" alt="${p.name}">
                <h3>${p.name}</h3>
                <div class="price">${p.price} ₽</div>
                <button class="add-btn" onclick="alert('Добавлено!')">Добавить</button>
            </div>
        `;
    });
</script>

</body>
</html>
